target-version = "py310"
line-length = 79

extend-exclude = [
    "infrastructure/sentry-self-hosted",
]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "B",
    "ASYNC",
]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

[lint.per-file-ignores]
"services/admin_service/admin_panel/test_settings.py" = ["E402", "F403"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
