target-version = "py310"
line-length = 79

extend-exclude = [
    "infrastructure/sentry-self-hosted",
]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "B",
    "ASYNC",
]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"