services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      content-service:
        condition: service_started
      auth-service:
        condition: service_started
      admin-service:
        condition: service_started
      events-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ugc-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    restart: unless-stopped

  profile-postgres:
    image: postgres:16
    env_file:
      - ./services/profile_service/.env
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  profile-service:
    build:
      context: ./services/profile_service
    env_file:
      - ./services/profile_service/.env
    expose:
      - "8000"
    depends_on:
      profile-postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    env_file:
      - ./services/auth_service/.env
    expose:
      - "8000"
    depends_on:
      auth-notification-migrate:
        condition: service_completed_successfully
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  admin-service:
    build:
      context: ./services/admin_service
      dockerfile: Dockerfile
    env_file:
      - ./services/admin_service/.env
    expose:
      - "8000"
    volumes:
      - admin_service_data:/app/data
    depends_on:
      theatre-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  auth-postgres:
    image: postgres:16
    env_file:
      - ./services/auth_service/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-service:
    build:
      context: ./services/content_service
      dockerfile: Dockerfile
    env_file:
      - ./services/content_service/.env
    expose:
      - "8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  ugc-service:
    build:
      context: ./services/ugc_service
      dockerfile: Dockerfile
    env_file:
      - ./services/ugc_service/.env
    expose:
      - "8000"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      content-service:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb:
    build:
      context: ./infrastructure/mongodb
      dockerfile: Dockerfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ugc_user
      MONGO_INITDB_ROOT_PASSWORD: ugc_password
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongodb-init:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ugc_user
      MONGO_INITDB_ROOT_PASSWORD: ugc_password
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        mongosh --quiet --host mongodb:27017 \
          --username "$$MONGO_INITDB_ROOT_USERNAME" \
          --password "$$MONGO_INITDB_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval '
            try {
              rs.status();
            } catch (error) {
              if (error.codeName === "NotYetInitialized") {
                rs.initiate({
                  _id: "rs0",
                  members: [{_id: 0, host: "mongodb:27017"}]
                });
              } else {
                throw error;
              }
            }
          '
        until mongosh --quiet --host mongodb:27017 \
          --username "$$MONGO_INITDB_ROOT_USERNAME" \
          --password "$$MONGO_INITDB_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'
        do
          sleep 1
        done
    restart: "no"

  theatre-db:
    image: postgres:16
    environment:
      POSTGRES_DB: theatre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - ./infrastructure/postgres/theatre/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theatre"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.2
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./infrastructure/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    expose:
      - "5044"
      - "9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9600/_node/pipelines >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.4.2
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      ENVIRONMENT: local
    volumes:
      - ./infrastructure/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-etl:
    build:
      context: ./services/content_etl
      dockerfile: Dockerfile
    env_file:
      - ./services/content_etl/.env
    environment:
      SCHEMAS_DIR: /app/mappings
    volumes:
      - ./infrastructure/elasticsearch/mappings:/app/mappings:ro
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  kafka-volume-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for directory in /volumes/kafka-0 /volumes/kafka-1 /volumes/kafka-2; do
          chown 1000:1000 "$$directory"
          chmod u+rwx "$$directory"
        done
    volumes:
      - kafka_0_data:/volumes/kafka-0
      - kafka_1_data:/volumes/kafka-1
      - kafka_2_data:/volumes/kafka-2
    restart: "no"

  kafka-0:
    image: apache/kafka:4.3.1
    hostname: kafka-0
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    volumes:
      - kafka_0_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-1:
    image: apache/kafka:4.3.1
    hostname: kafka-1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    volumes:
      - kafka_1_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:4.3.1
    hostname: kafka-2
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    volumes:
      - kafka_2_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-0:9092 \
          --create \
          --if-not-exists \
          --topic user-events \
          --partitions 6 \
          --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-0:9092 \
          --create \
          --if-not-exists \
          --topic user-events-dlq \
          --partitions 6 \
          --replication-factor 3
        for topic in notification-delivery-v1 notification-delivery-v1-dlq notification-results-v1 cinema-events-v1 notification-failed-v1; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-0:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 3 \
            --config min.insync.replicas=2 --config retention.ms=-1
        done
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-0:9092 \
          --entity-type topics --entity-name notification-delivery-v1-dlq \
          --alter --add-config max.message.bytes=2097152
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    env_file:
      - ./services/events_etl/.env
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: events_etl
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user events_etl --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  events-service:
    build:
      context: ./services/events_service
      dockerfile: Dockerfile
    env_file:
      - ./services/events_service/.env
    expose:
      - "8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  events-etl:
    build:
      context: ./services/events_etl
      dockerfile: Dockerfile
    env_file:
      - ./services/events_etl/.env
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notification-admin-local
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/notifications/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  notification-migrate:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_service/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      notification-postgres:
        condition: service_healthy
    restart: "no"

  delivery-migrate:
    build:
      context: ./services/notification_worker
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_worker/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      notification-postgres:
        condition: service_healthy
    restart: "no"

  notification-service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_service/.env
    expose:
      - "8000"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notification-outbox:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_service/.env
    command: ["python", "-m", "messaging.outbox"]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped

  notification-worker:
    build:
      context: ./services/notification_worker
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_worker/.env
    depends_on:
      delivery-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  film-notification-migrate:
    image: postgres:16
    environment:
      PGHOST: theatre-db
      PGUSER: postgres
      PGPASSWORD: secret
      PGDATABASE: theatre
    volumes:
      - ./infrastructure/postgres/theatre/notifications.sql:/migration.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-1", "-f", "/migration.sql"]
    depends_on:
      theatre-db:
        condition: service_healthy
    restart: "no"

  auth-notification-migrate:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    env_file:
      - ./services/auth_service/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: "no"

  notification-sender:
    build:
      context: ./services/notification_worker
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_worker/.env
    command: ["python", "-m", "messaging.sender"]
    environment:
      SERVICE_NAME: "notification-sender"
    depends_on:
      delivery-migrate:
        condition: service_completed_successfully
      profile-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped

  notification-results-outbox:
    build:
      context: ./services/notification_worker
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_worker/.env
    command: ["python", "-m", "messaging.relay"]
    environment:
      SERVICE_NAME: "notification-results-outbox"
    depends_on:
      delivery-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped

  notification-results:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_service/.env
    command: ["python", "-m", "messaging.updates", "results"]
    environment:
      SERVICE_NAME: "notification-results"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "core.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped

  notification-events:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    env_file:
      - ./services/notification_service/.env
    command: ["python", "-m", "messaging.updates", "events"]
    environment:
      SERVICE_NAME: "notification-events"
    depends_on:
