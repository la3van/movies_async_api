services:
  auth-service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    env_file:
      - ./services/auth_service/.env
    ports:
      - "127.0.0.1:8008:8000"
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  auth-postgres:
    image: postgres:16
    env_file:
      - ./services/auth_service/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
  content-service:
    build:
      context: ./services/content_service
      dockerfile: Dockerfile
    env_file:
      - ./services/content_service/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  theatre-db:
    image: postgres:16
    environment:
      POSTGRES_DB: theatre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - ./infrastructure/postgres/threatre/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theatre"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-etl:
    build:
      context: ./services/content_etl
      dockerfile: Dockerfile
    env_file:
      - ./services/content_etl/.env
    environment:
      SCHEMAS_DIR: /app/mappings
    volumes:
      - ./infrastructure/elasticsearch/mappings:/app/mappings:ro
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auth_postgres_data:
  postgres_data:
  elasticsearch_data:
  redis_data: