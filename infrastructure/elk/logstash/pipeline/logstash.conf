input {
  beats {
    port => 5044
    ecs_compatibility => "v8"
  }
}

filter {
  if [container][labels][com_docker_compose_service] {
    mutate {
      copy => {
        "[container][labels][com_docker_compose_service]"
          => "[service][name]"
      }
    }
  }

  if ![service][name] {
    mutate {
      add_field => { "[service][name]" => "unknown" }
    }
  }

  mutate {
    lowercase => ["[service][name]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{[service][name]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}