filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    enabled: true

    paths:
      - /var/lib/docker/containers/*/*.log

    parsers:
      - container:
          stream: all
          format: docker

processors:
  - add_host_metadata: ~

  - add_docker_metadata:
      host: unix:///var/run/docker.sock
      labels.dedot: true

output.logstash:
  hosts:
    - logstash:5044

logging.level: info