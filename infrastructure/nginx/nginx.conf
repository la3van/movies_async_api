user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    map $http_x_request_id $request_id_header {
        "~^.{1,128}$" $http_x_request_id;
        default       $request_id;
    }

    map $uri $rate_limit_key {
        default             $binary_remote_addr;

        /health             "";

        /docs               "";
        /redoc              "";
        /openapi.json       "";

        /api/openapi        "";
        /api/openapi.json   "";
        /api/redoc          "";

        /ugc/docs           "";
        /ugc/openapi.json   "";
        /ugc/redoc          "";
        /ugc/health         "";
        /ugc/ready          "";

        "~^/static/"        "";
    }

    limit_req_zone
        $rate_limit_key
        zone=global_per_ip:10m
        rate=50r/s;

    limit_req_status 429;
    limit_req_log_level warn;

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_id=$request_id_header '
        'upstream_request_id=$upstream_http_x_request_id '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'limit_req_status=$limit_req_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    upstream content_service {
        server content-service:8000;
        keepalive 16;
    }

    upstream auth_service {
        server auth-service:8000;
        keepalive 16;
    }

    upstream profile_service {
        server profile-service:8000;
        keepalive 16;
    }

    upstream admin_service {
        server admin-service:8000;
        keepalive 16;
    }

    upstream events_service {
        server events-service:8000;
        keepalive 16;
    }

    upstream notification_service {
        server notification-service:8000;
        keepalive 16;
    }

    upstream ugc_service {
        server ugc-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        limit_req
            zone=global_per_ip
            burst=100
            nodelay;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_header;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id_header always;

        location = / {
            return 302 /api/openapi;
        }

        location ~ ^/api/v1/(auth|users|roles|permissions)(/|$) {
            proxy_pass http://auth_service;
        }

        location ~ ^/api/v1/profiles(/|$) {
            client_max_body_size 16k;
            proxy_pass http://profile_service;
        }

        location /profiles/ {
            proxy_pass http://profile_service;
        }

        location = /docs {
            proxy_pass http://auth_service;
        }

        location = /openapi.json {
            proxy_pass http://auth_service;
        }

        location = /redoc {
            proxy_pass http://auth_service;
        }

        location = /health {
            proxy_pass http://auth_service;
        }

        location ^~ /api/v1/internal/ {
            return 404;
        }

        location /api/v1/notifications {
            client_max_body_size 512k;
            proxy_pass http://notification_service;
        }

        location = /notifications/health {
            proxy_pass http://notification_service/health;
        }

        location = /notifications/ready {
            proxy_pass http://notification_service/ready;
        }

        location /notifications/ {
            proxy_pass http://notification_service;
        }

        location = /api/v1/events {
            proxy_pass http://events_service;
        }

        location ~ ^/api/v1/(bookmarks|ratings|reviews)(/|$) {
            proxy_pass http://ugc_service;
        }

        location = /ugc/health {
            proxy_pass http://ugc_service/health;
        }

        location = /ugc/ready {
            proxy_pass http://ugc_service/ready;
        }

        location /ugc/ {
            proxy_pass http://ugc_service;
        }

        location /api/ {
            proxy_pass http://content_service;
        }

        location = /api/redoc {
            proxy_pass http://content_service/redoc;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_service;
        }

        location /static/ {
            proxy_pass http://admin_service;
        }

        location /__debug__/ {
            proxy_pass http://admin_service;
        }

        location / {
            return 404;
        }
    }
}