user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_id=$request_id_header '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    upstream content_service {
        server content-service:8000;
        keepalive 16;
    }

    upstream auth_service {
        server auth-service:8000;
        keepalive 16;
    }

    upstream admin_service {
        server admin-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_header;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header X-Request-ID $request_id_header always;

        location = / {
            return 302 /api/openapi;
        }

        # -------------------------
        # Auth Service
        # -------------------------
        location ~ ^/api/v1/(auth|users|roles|permissions)(/|$) {
            proxy_pass http://auth_service;
        }

        location = /docs {
            proxy_pass http://auth_service;
        }

        location = /openapi.json {
            proxy_pass http://auth_service;
        }

        location = /redoc {
            proxy_pass http://auth_service;
        }

        location = /health {
            proxy_pass http://auth_service;
        }

        # -------------------------
        # Content Service
        # -------------------------
        location /api/ {
            proxy_pass http://content_service;
        }

        location = /api/redoc {
            proxy_pass http://content_service/redoc;
        }

        # -------------------------
        # Admin Service
        # -------------------------
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_service;
        }

        location /static/ {
            proxy_pass http://admin_service;
        }

        # Django Debug Toolbar.
        location /__debug__/ {
            proxy_pass http://admin_service;
        }

        location / {
            return 404;
        }
    }
}