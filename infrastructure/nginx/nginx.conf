user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    # =========================================================
    # X-Request-ID
    # =========================================================
    map $http_x_request_id $request_id_header {
        "~^.{1,128}$" $http_x_request_id;
        default       $request_id;
    }

    # =========================================================
    # Global rate limiting
    # =========================================================
    map $uri $rate_limit_key {
        default             $binary_remote_addr;

        /health             "";

        /docs               "";
        /redoc              "";
        /openapi.json       "";

        /api/openapi        "";
        /api/openapi.json   "";
        /api/redoc          "";

        "~^/static/"        "";
    }

    limit_req_zone
        $rate_limit_key
        zone=global_per_ip:10m
        rate=50r/s;

    limit_req_status 429;
    limit_req_log_level warn;

    # =========================================================
    # Logging
    # =========================================================
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_id=$request_id_header '
        'upstream_request_id=$upstream_http_x_request_id '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'limit_req_status=$limit_req_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # =========================================================
    # General HTTP settings
    # =========================================================
    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    # =========================================================
    # Upstreams
    # =========================================================
    upstream content_service {
        server content-service:8000;
        keepalive 16;
    }

    upstream auth_service {
        server auth-service:8000;
        keepalive 16;
    }

    upstream admin_service {
        server admin-service:8000;
        keepalive 16;
    }

    upstream events_service {
        server events-service:8000;
        keepalive 16;
    }

    # =========================================================
    # HTTP server
    # =========================================================
    server {
        listen 80;
        server_name _;

        # =====================================================
        # Apply global rate limiting
        # =====================================================
        limit_req
            zone=global_per_ip
            burst=100
            nodelay;

        # =====================================================
        # Proxy settings
        # =====================================================
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_header;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id_header always;

        # =====================================================
        # Root redirect
        # =====================================================
        location = / {
            return 302 /api/openapi;
        }

        # =====================================================
        # Auth Service
        # =====================================================
        location ~ ^/api/v1/(auth|users|roles|permissions)(/|$) {
            proxy_pass http://auth_service;
        }

        location = /docs {
            proxy_pass http://auth_service;
        }

        location = /openapi.json {
            proxy_pass http://auth_service;
        }

        location = /redoc {
            proxy_pass http://auth_service;
        }

        location = /health {
            proxy_pass http://auth_service;
        }

        # =====================================================
        # Events Service
        # =====================================================
        location = /api/v1/events {
            proxy_pass http://events_service;
        }

        # =====================================================
        # Content Service
        # =====================================================
        location /api/ {
            proxy_pass http://content_service;
        }

        location = /api/redoc {
            proxy_pass http://content_service/redoc;
        }

        # =====================================================
        # Admin Service
        # =====================================================
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_service;
        }

        location /static/ {
            proxy_pass http://admin_service;
        }

        location /__debug__/ {
            proxy_pass http://admin_service;
        }

        # =====================================================
        # Unknown routes
        # =====================================================
        location / {
            return 404;
        }
    }
}