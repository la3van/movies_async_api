services:
  async_api:
    build:
      context: ../../async_api
      dockerfile: Dockerfile
    env_file:
      - ../../async_api/.env
    command:
      - coverage
      - run
      - --rcfile=.coveragerc
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      COVERAGE_FILE: /coverage/.coverage
    volumes:
      - ./coverage:/coverage
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/openapi.json')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  redis:
    image: redis:7
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app
    volumes:
      - ../../tests:/app/tests:ro
      - ../../schemas:/app/schemas:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      async_api:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        python -m tests.functional.utils.wait_for_es &&
        python -m tests.functional.utils.wait_for_redis &&
        pytest -v tests/functional/src